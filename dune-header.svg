<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c18"/>
      <stop offset="0.5" stop-color="#4a2230"/>
      <stop offset="0.8" stop-color="#c2602a"/>
      <stop offset="1" stop-color="#e89a4a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="800" height="220" rx="14"/></clipPath>
  </defs>

  <style>
    .twinkle { animation: twinkle 3s ease-in-out infinite alternate; }
    .t2 { animation-delay: 1.1s; } .t3 { animation-delay: 2s; }
    @keyframes twinkle { from { opacity: .25 } to { opacity: .9 } }

    .orni { animation: fly 16s linear infinite; }
    @keyframes fly {
      0%   { transform: translate(-80px, 0) }
      50%  { transform: translate(400px, -12px) }
      100% { transform: translate(900px, 4px) }
    }
    .bob { animation: bob 1.4s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(-2px) } to { transform: translateY(3px) } }
    .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .32s ease-in-out infinite alternate; }
    .wing.rear { animation-delay: .16s; }
    @keyframes flap { from { transform: scaleY(1) } to { transform: scaleY(-.7) } }

    .rumble { animation: rumble .18s steps(2) infinite; }
    @keyframes rumble { from { transform: translate(0, 0) } to { transform: translate(.6px, -.4px) } }

    .dust { transform-box: fill-box; transform-origin: center; opacity: 0; animation: puff 3s ease-out infinite; }
    .d2 { animation-delay: .75s; } .d3 { animation-delay: 1.5s; } .d4 { animation-delay: 2.25s; }
    @keyframes puff {
      0%   { opacity: .75; transform: translate(0, 0) scale(.4) }
      100% { opacity: 0;   transform: translate(-60px, -45px) scale(2.4) }
    }

    .spark { opacity: 0; animation: spark 2.2s ease-out infinite; }
    .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.4s; }
    @keyframes spark {
      0%   { opacity: 1; transform: translate(0, 0) }
      100% { opacity: 0; transform: translate(-18px, -40px) }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="800" height="220" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#f3e6c8">
      <circle class="twinkle" cx="260" cy="28" r="1.3"/>
      <circle class="twinkle t2" cx="340" cy="52" r="1"/>
      <circle class="twinkle t3" cx="430" cy="22" r="1.4"/>
      <circle class="twinkle" cx="610" cy="40" r="1"/>
      <circle class="twinkle t2" cx="700" cy="20" r="1.3"/>
      <circle class="twinkle t3" cx="60" cy="30" r="1"/>
    </g>

    <!-- twin moons -->
    <circle cx="120" cy="48" r="15" fill="#f3e6c8"/>
    <circle cx="164" cy="68" r="7" fill="#d9c9a8"/>

    <!-- far dunes -->
    <path d="M0 150 Q120 118 240 140 T480 134 T720 126 T800 134 L800 220 L0 220Z" fill="#6e3f1c"/>

    <!-- flying craft with flapping wings -->
    <g transform="translate(0,78)">
      <g class="orni"><g class="bob">
        <ellipse class="wing rear" cx="-12" cy="-13" rx="17" ry="9" fill="#efe3cf" fill-opacity=".55" stroke="#efe3cf" stroke-opacity=".8"/>
        <path d="M-24 0 L-46 -5 L-44 4 Z" fill="#8d8478"/>
        <ellipse cx="0" cy="0" rx="26" ry="6" fill="#b3a898"/>
        <ellipse cx="17" cy="-1" rx="8" ry="4.5" fill="#f2a541" fill-opacity=".7"/>
        <path d="M-12 6 L-14 11 M12 6 L14 11 M-18 11 L18 11" stroke="#5a4a3c" stroke-width="1.5" fill="none"/>
        <ellipse class="wing" cx="6" cy="-14" rx="22" ry="10" fill="#efe3cf" fill-opacity=".55" stroke="#efe3cf" stroke-opacity=".8"/>
      </g></g>
    </g>

    <!-- desert crawler harvesting spice -->
    <g transform="translate(518,119) rotate(-12)">
      <circle class="dust"    cx="4" cy="36" r="8" fill="#e8c48a"/>
      <circle class="dust d2" cx="4" cy="36" r="8" fill="#e8c48a"/>
      <circle class="dust d3" cx="4" cy="36" r="8" fill="#e8c48a"/>
      <circle class="dust d4" cx="4" cy="36" r="8" fill="#e8c48a"/>
      <g class="rumble">
        <rect x="0" y="30" width="86" height="13" rx="6.5" fill="#2b1d14"/>
        <g fill="#5a4030">
          <circle cx="9" cy="36.5" r="3.5"/><circle cx="23" cy="36.5" r="3.5"/><circle cx="37" cy="36.5" r="3.5"/>
          <circle cx="51" cy="36.5" r="3.5"/><circle cx="65" cy="36.5" r="3.5"/><circle cx="78" cy="36.5" r="3.5"/>
        </g>
        <path d="M4 30 L11 8 L70 8 L84 22 L84 30 Z" fill="#7a6a58"/>
        <rect x="14" y="15" width="52" height="4" fill="#5a4a3c"/>
        <rect x="14" y="22" width="52" height="2" fill="#5a4a3c"/>
        <rect x="20" y="-7" width="7" height="16" fill="#5a4a3c"/>
        <rect x="58" y="-1" width="17" height="10" rx="2" fill="#8c7b66"/>
        <rect x="62" y="2" width="9" height="4" fill="#f2a541"/>
      </g>
      <g fill="#f2a541">
        <circle class="spark"    cx="23" cy="-8" r="1.8"/>
        <circle class="spark s2" cx="25" cy="-8" r="1.4"/>
        <circle class="spark s3" cx="21" cy="-8" r="1.6"/>
      </g>
    </g>

    <!-- mid dunes -->
    <path d="M0 170 Q150 140 300 160 T560 150 T800 158 L800 220 L0 220Z" fill="#a8622a"/>

    <!-- near dunes -->
    <path d="M0 196 Q200 172 400 190 T800 186 L800 220 L0 220Z" fill="#d8954d"/>
  </g>
</svg>
