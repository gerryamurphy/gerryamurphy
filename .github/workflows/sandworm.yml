# Save as .github/workflows/sandworm.yml in your <username>/<username> repo
name: Sandworm

on:
  schedule:
    - cron: "0 */12 * * *"   # redraw twice a day
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summon the worm
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_dots: empty cell first, then low → high contribution (exactly 5)
          outputs: |
            dist/sandworm-light.svg?color_snake=#5a3a1c&color_dots=#efe3c8,#e3c28a,#d49a4f,#c0702a,#8f3f12
            dist/sandworm-dark.svg?color_snake=#e8d3a8&color_dots=#2a211a,#5c3d1e,#8f5a24,#c97a2b,#f2a541

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
